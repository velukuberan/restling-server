name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Python Quality Checks
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: restling
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: restling_dev
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: restling
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: restling_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restling -d restling_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run quality checks
        run: make check

